# Resume Applicator's redirect server; README.md says how to deploy it. The name is part of every
# tracked link: https://links.<your account's subdomain>.workers.dev/<token>
name = "links"
main = "src/worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

# No database_id: the Deploy to Cloudflare button and `wrangler deploy` create the database, or
# reuse the one of this name. Don't commit an id Wrangler writes in here after a deploy.
[[d1_databases]]
binding = "DB"
database_name = "resume-applicator-links"

# Your own domain instead of links.<account>.workers.dev (the domain must be on Cloudflare):
# routes = [{ pattern = "go.example.com", custom_domain = true }]

[observability]
enabled = true
